<text x="190.0" y="361" class="d" text-anchor="middle">build api · pipeline · ui · mlflow images</text>
<text x="190.0" y="378" class="d" text-anchor="middle">demo bundle → docker compose up</text>
<text x="190.0" y="395" class="d" text-anchor="middle">smoke test through nginx: /ready,</text>
<text x="190.0" y="412" class="d" text-anchor="middle">/v1/forecast, /v1/predict, /metrics</text>
