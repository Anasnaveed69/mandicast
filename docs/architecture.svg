<text x="190.0" y="504" class="t" text-anchor="middle">cd.yml  (after ci passes on main)</text>
<text x="190.0" y="524" class="d" text-anchor="middle">push images to GHCR (sha + latest)</text>
<text x="190.0" y="541" class="d" text-anchor="middle">SSH → git reset → deploy.sh</text>
<text x="190.0" y="558" class="d" text-anchor="middle">→ compose pull + up → health check</text>
