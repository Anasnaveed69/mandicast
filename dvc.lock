            batch_size: 128
            max_epochs: 40
            patience: 6
          chronos:
            enabled: true
            model_id: amazon/chronos-bolt-tiny
            context_length: 512
        quantiles:
        - 0.1
        - 0.5
        - 0.9
        seed: 42
    outs:
