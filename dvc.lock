schema: '2.0'
stages:
  prepare:
    cmd: python -m mandicast.prepare
    deps:
    - path: data/raw/amis_lahore.csv
      hash: md5
      md5: 58e82be7800ad76ee8ee921b148a7b54
      size: 3391225
    - path: mandicast/prepare.py
      hash: md5
      md5: 0530b5b11aaa636a904c861b02c4a0df
      size: 7448
    params:
      params.yaml:
        data:
          raw_path: data/raw/amis_lahore.csv
          city: Lahore
          commodities:
            tomato:
            - ^tomato$
            onion:
            - ^onion$
            potato:
            - ^potato\s*fresh
            - ^potato\s*sugar\s*free
            - ^potato\s*\(?\s*store
        prepare:
          start_date: '2018-01-01'
          max_gap_days: 7
          spike_sigmas: 6.0
          spike_min_jump: 0.4
    outs:
    - path: data/processed/prices.parquet
      hash: md5
      md5: d480c9bb5a220ebc2965a6415cf21db6
      size: 11761
    - path: reports/data_quality.json
      hash: md5
      md5: 6d7d387decc1f2d48380b91e80efaa40
      size: 598
  features:
    cmd: python -m mandicast.features
    deps:
    - path: data/processed/prices.parquet
      hash: md5
      md5: d480c9bb5a220ebc2965a6415cf21db6
      size: 11761
    - path: mandicast/features.py
      hash: md5
      md5: 4173b9dabb4c0ceade4aff5d098b10dc
      size: 3836
    params:
      params.yaml:
        features:
          lags:
          - 1
          - 2
          - 3
          - 7
          - 14
          - 28
          rolling_windows:
          - 7
          - 14
          - 28
          long_window: 365
    outs:
    - path: data/processed/features.parquet
      hash: md5
      md5: 96ac5462075d40080fdb5aec26d3cae5
      size: 185398
  tune:
    cmd: python -m mandicast.tune
    deps:
    - path: data/processed/features.parquet
      hash: md5
      md5: 96ac5462075d40080fdb5aec26d3cae5
      size: 185398
    - path: mandicast/backtest.py
      hash: md5
      md5: d34cd601ff2a373007d113f5b33f2e4a
      size: 2346
    - path: mandicast/evaluation.py
      hash: md5
      md5: a8a56c798f4a0564fd1f2d80161da5eb
      size: 3106
    - path: mandicast/models/tabular.py
      hash: md5
      md5: a27efff22c69d9c22377b6a164cebafc
      size: 4129
    - path: mandicast/tune.py
      hash: md5
      md5: b30b66cbb521c605f85f4657207e6be1
      size: 3520
    params:
      params.yaml:
        backtest:
          horizons:
          - 1
          - 7
          n_folds: 5
          test_size: 30
          min_train_days: 365
        models.xgboost:
          enabled: true
          use_tuned: true
          n_estimators: 400
          max_depth: 4
          learning_rate: 0.05
          subsample: 0.8
          colsample_bytree: 0.8
          min_child_weight: 5
        seed: 42
        tune:
          n_trials: 25
          inner_folds: 3
    outs:
    - path: models/xgb_params.json
      hash: md5
      md5: 654d19dc32896f658baab33880563721
      size: 229
  benchmark:
    cmd: python -m mandicast.benchmark
