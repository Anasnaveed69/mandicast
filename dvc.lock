    - path: models/xgb_params.json
      hash: md5
      md5: 654d19dc32896f658baab33880563721
      size: 229
    params:
      params.yaml:
        backtest:
          horizons:
          - 1
          - 7
          n_folds: 5
          test_size: 30
          min_train_days: 365
        models:
          naive:
            enabled: true
          seasonal_naive:
            enabled: true
            season: 364
          linear:
            enabled: true
            alpha: 1.0
          xgboost:
            enabled: true
