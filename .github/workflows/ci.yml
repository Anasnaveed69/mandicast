name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check mandicast tests ui
      - name: Tests (pipeline, API, jobs)
        run: pytest -q

  docker:
    name: build images + compose smoke test
    needs: test
    runs-on: ubuntu-latest
    env:
      REGISTRY: mandicast
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          target: api
          load: true
          tags: mandicast/mandicast-api:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ui.Dockerfile
          load: true
          tags: mandicast/mandicast-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - name: Build mlflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mlflow.Dockerfile
          tags: mandicast/mandicast-mlflow:ci
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,mode=max,scope=mlflow
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          target: pipeline
          tags: mandicast/mandicast-pipeline:ci
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Demo bundle (fake prices + models, built inside the api image)
        run: |
          mkdir -p demo
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/demo:/out" \
            mandicast/mandicast-api:ci python -m mandicast.demo --out /out

      - name: Start api + ui + nginx
        env:
          MODEL_SOURCE: local
          DATA_DIR: ./demo/data
          SERVING_DIR: ./demo/models/serving
        run: docker compose up -d --no-build nginx

      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost/api/ready > /dev/null && break
            sleep 3
          done
          curl -fsS http://localhost/api/ready | jq .
          curl -fsS "http://localhost/api/v1/forecast/tomato?horizon=7" | jq -e '.forecasts[0].yhat > 0'
          curl -fsS http://localhost/api/v1/forecast | jq -e '.forecasts | length == 6'
          python3 - <<'EOF' > payload.json
          import json, datetime
          d0 = datetime.date(2026, 1, 1)
          hist = [{"date": str(d0 + datetime.timedelta(days=i)), "price": 5000 + i} for i in range(60)]
          print(json.dumps({"commodity": "onion", "horizon": 1, "history": hist}))
          EOF
          curl -fsS -X POST -H 'Content-Type: application/json' -d @payload.json \
              http://localhost/api/v1/predict | tee /dev/stderr | jq -e '.yhat > 0'
          curl -fsS http://localhost/api/metrics | grep -q mandicast_predictions_total
          curl -fsS http://localhost/_stcore/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 200

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
