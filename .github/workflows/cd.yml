name: cd

# Runs after `ci` succeeds on main (or by hand): publish the four images to GHCR,
# then roll them out on the EC2 host with docker compose.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: api, file: docker/app.Dockerfile, target: api }
          - { image: pipeline, file: docker/app.Dockerfile, target: pipeline }
          - { image: ui, file: docker/ui.Dockerfile, target: "" }
          - { image: mlflow, file: docker/mlflow.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Registry name (GHCR needs lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/mandicast-${{ matrix.image }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/mandicast-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          build-args: GIT_COMMIT=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Server configured?
        if: env.EC2_HOST == ''
        run: echo "::notice::EC2_HOST secret is not set; images were published but nothing was deployed."
      - name: Registry name
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Roll out on EC2
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          GIT_SHA: ${{ env.SHA }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GIT_SHA,REGISTRY,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script: |
            set -e
            cd ~/mandicast
            git fetch --quiet origin main
            git reset --hard "$GIT_SHA"
            bash deploy/deploy.sh
      - name: Public smoke test
        if: env.EC2_HOST != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS "http://$EC2_HOST/api/health" && break
            sleep 6
          done
          curl -fsS "http://$EC2_HOST/api/health"
          curl -sS "http://$EC2_HOST/api/ready" || true
