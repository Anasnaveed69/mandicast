[project]
name = "mandicast"
version = "0.2.0"
description = "Lahore mandi price forecasting with an MLOps pipeline (FAST-NU MLOps, Fall 2026)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
