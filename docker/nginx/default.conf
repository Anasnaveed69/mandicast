# Single public entry point:
#   /        -> Streamlit UI
#   /api/    -> FastAPI (prefix stripped; the API knows it lives under /api via API_ROOT_PATH)
# MLflow is NOT exposed here; reach it with an SSH tunnel (see docs/deployment.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://ui:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # streamlit uses a websocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }
}
